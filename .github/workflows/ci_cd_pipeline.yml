name: Plateforme Arbitrage CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout du code (Git Pull)
      uses: actions/checkout@v3

    - name: 🐍 Configuration de Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 📦 Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: 🧪 Lancement des tests automatisés (PyTest)
      run: |
        pytest tests/

    - name: 🐳 Simulation Docker Build (Test de l'image)
      run: |
        echo "Construction de l'image Docker Streamlit V1..."
        docker-compose build streamlit-dashboard-v1

    - name: 🚀 Simulation de Déploiement
      if: success()
      run: |
        echo "✅ Tests réussis ! Déploiement de la version validée en production."
